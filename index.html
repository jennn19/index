<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼？- 互動美食抽籤</title>
    <style>
        /* CSS 變數：定義主視覺色調 */
        :root {
            --primary-color: #ff6b6b; /* 活潑珊瑚紅 */
            --secondary-color: #feca57; /* 溫暖黃色 */
            --bg-color: #f7f9fc; /* 淺灰藍背景 */
            --text-color: #2d3436; /* 深灰文字 */
        }

        /* 網頁基礎佈局 */
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 主卡片容器 */
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 450px;
            width: 90%;
            transition: transform 0.3s ease;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            font-size: 2.2rem;
        }

        .subtitle {
            color: #888;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        /* 輪盤結果顯示區塊 */
        .result-box {
            background: #fff8f8;
            border: 2px dashed var(--primary-color);
            border-radius: 15px;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1rem;
        }

        #result {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--text-color);
            transition: all 0.1s ease;
        }

        /* 互動控制按鈕 */
        .action-btn {
            background: linear-gradient(135deg, var(--primary-color), #ff4757);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            transition: all 0.2s ease;
            width: 100%;
        }

        /* 按鈕懸停效果 */
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(255, 107, 107, 0.6);
        }

        /* 按鈕點擊效果 */
        .action-btn:active {
            transform: translateY(1px);
        }

        /* 按鈕禁用狀態（抽籤中） */
        .action-btn:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* 滾動時美食文字的脈衝動畫 */
        .spinning {
            animation: pulse 0.1s infinite;
            color: #ff4757 !important;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>今天吃什麼？ 🍳</h1>
        <div class="subtitle">解決人生最大的終極難題</div>

        <!-- 顯示抽籤結果的區塊 -->
        <div class="result-box">
            <div id="result">點擊下方按鈕開始</div>
        </div>

        <!-- 控制抽籤的按鈕 -->
        <button class="action-btn" id="spinBtn">幫我決定！</button>
    </div>

    <script>
        // 1. 內建台灣在地美食清單
        const foodList = [
            "滷肉飯 + 貢丸湯 🥣",
            "乾拌麵 + 燙青菜 🥢",
            "排骨飯便當 🍱",
            "牛肉麵 + 花干 🍜",
            "現包小籠包 🥢",
            "熱騰騰火鍋 🍲",
            "奶油義大利麵 🍝",
            "日式豚骨拉麵 🍜",
            "豪華生魚片丼飯 🍣",
            "韓式炸雞 + 部隊鍋 🍗",
            "麥當勞炸雞速食 🍔",
            "雙醬厚切咖哩飯 🍛",
            "台式夜市鐵板燒 🥩",
            "舒肥雞健康沙拉 🥗",
            "窯烤手工披薩 🍕"
        ];

        // 2. 取得網頁上的 HTML 元素
        const resultEl = document.getElementById('result');
        const spinBtn = document.getElementById('spinBtn');
        let isSpinning = false; // 記錄目前是否正在抽籤中

        // 3. 綁定按鈕點擊事件
        spinBtn.addEventListener('click', () => {
            if (isSpinning) return; // 如果正在抽籤，則不重複執行
            
            isSpinning = true;
            spinBtn.disabled = true; // 禁用按鈕
            spinBtn.innerText = "正在挑選中...";
            resultEl.classList.add('spinning'); // 加入滾動動態視覺效果

            let counter = 0;
            // 使用 setInterval 實作定時動態滾動效果
            const interval = setInterval(() => {
                // 隨機切換清單中的美食文字
                const randomIndex = Math.floor(Math.random() * foodList.length);
                resultEl.innerText = foodList[randomIndex];
                counter++;

                // 滾動次數達 15 次後定格停止（約 1.2 秒）
                if (counter > 15) { 
                    clearInterval(interval); // 停止計時器
                    
                    // 計算最終隨機決定
                    const finalIndex = Math.floor(Math.random() * foodList.length);
                    resultEl.innerText = foodList[finalIndex];
                    
                    // 恢復網頁與按鈕狀態
                    resultEl.classList.remove('spinning');
                    spinBtn.disabled = false; // 重新啟用按鈕
                    spinBtn.innerText = "換個口味？";
                    isSpinning = false;
                }
            }, 80); // 每 80 毫秒滾動切換一次文字
        });
    </script>
</body>
</html>
