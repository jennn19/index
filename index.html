<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼？- 互動美食抽籤</title>
    <style>
        /* CSS 變數：升級為令人食指大動的美味暖色調 */
        :root {
            --primary-color: #ff4757; /* 鮮嫩蕃茄紅 */
            --secondary-color: #ff7f50; /* 炙燒起司橙 */
            --bg-color: #fff9f1; /* 舒服溫暖的布丁奶油色背景 */
            --text-color: #2f3542; /* 柔和的深焦糖色文字 */
        }

        /* 網頁基礎佈局 */
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#ffeaa7 1px, transparent 1px); /* 微甜的蛋黃色圓點點綴 */
            background-size: 20px 20px;
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 主卡片容器 */
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 30px; /* 更圓潤可愛的線條 */
            box-shadow: 0 20px 40px rgba(255, 127, 80, 0.12); /* 溫暖的橙色微光陰影 */
            border: 2px solid #ffeaa7;
            text-align: center;
            max-width: 450px;
            width: 90%;
            transition: transform 0.3s ease;
            position: relative;
            z-index: 10;
        }

        h1 {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            font-size: 2.4rem;
            font-weight: 900;
        }

        .subtitle {
            color: #747d8c;
            margin-bottom: 2rem;
            font-size: 1rem;
            font-weight: 500;
        }

        /* 輪盤結果顯示區塊 */
        .result-box {
            background: #fffdfa;
            border: 2px dashed var(--secondary-color);
            border-radius: 20px;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1rem;
            box-shadow: inset 0 0 15px rgba(255, 127, 80, 0.03);
        }

        #result {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary-color); /* 抽中的美食用美味的蕃茄紅放大顯示 */
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.8);
            transition: all 0.1s ease;
        }

        /* 互動控制按鈕 */
        .action-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 1.1rem 2.5rem;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3);
            transition: all 0.2s ease;
            width: 100%;
            letter-spacing: 1px;
        }

        /* 按鈕懸停效果 */
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(255, 71, 87, 0.45);
        }

        /* 按鈕點擊效果 */
        .action-btn:active {
            transform: translateY(1px);
        }

        /* 按鈕禁用狀態（抽籤中） */
        .action-btn:disabled {
            background: #a4b0be;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* 滾動時美食文字的脈衝動畫 */
        .spinning {
            animation: pulse 0.1s infinite;
            color: var(--secondary-color) !important;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* ========= 左右兩側固定漂浮插畫 (純 CSS 控制，100% 零當機風險) ========= */
        .food-illustration {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            font-size: 6rem;
            user-select: none;
            z-index: 1;
            animation: sideFloat 3s ease-in-out infinite;
        }

        .left-illustration {
            left: 10%;
        }

        .right-illustration {
            right: 10%;
            animation-delay: 1.5s;
        }

        @media (max-width: 950px) {
            .food-illustration {
                display: none;
            }
        }

        @keyframes sideFloat {
            0% { transform: translateY(-50%) translateY(0px); }
            50% { transform: translateY(-50%) translateY(-15px); }
            100% { transform: translateY(-50%) translateY(0px); }
        }
    </style>
</head>
<body>

    <!-- 👈 左側漂浮的「大口吃飯」插畫 -->
    <div class="food-illustration left-illustration">🍚</div>

    <!-- 👉 右側漂浮的「吸溜吃麵」插畫 -->
    <div class="food-illustration right-illustration">🍜</div>

    <div class="container">
        <h1>今天吃什麼？ 🍳</h1>
        <div class="subtitle">解決人生最大的終極難題</div>

        <!-- 顯示抽籤結果的區塊 -->
        <div class="result-box">
            <div id="result">點擊下方按鈕開始</div>
        </div>

        <!-- 控制抽籤的按鈕 -->
        <button class="action-btn" id="spinBtn">🔥 幫我決定！</button>
    </div>

    <script>
        // 原封不動的最穩固美食清單
        const foodList = [
            "滷肉飯 + 貢丸湯 🥣",
            "乾拌麵 + 燙青菜 🥢",
            "排骨飯便當 🍱",
            "牛肉麵 + 花干 🍜",
            "現包小籠包 🥢",
            "熱騰騰火鍋 🍲",
            "奶油義大利麵 🍝",
            "日式豚骨拉麵 🍜",
            "豪華生魚片丼飯 🍣",
            "韓式炸雞 + 部隊鍋 🍗",
            "麥當勞炸雞速食 🍔",
            "雙醬厚切咖哩飯 🍛",
            "夜市鐵板燒 🥩",
            "舒肥雞健康沙拉 🥗",
            "窯烤手工披薩 🍕"
        ];

        const resultEl = document.getElementById('result');
        const spinBtn = document.getElementById('spinBtn');
        let isSpinning = false;

        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            
            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.innerText = "正在挑選中...";
            resultEl.classList.add('spinning');

            let counter = 0;
            const interval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * foodList.length);
                resultEl.innerText = foodList[randomIndex];
                counter++;

                if (counter > 15) { 
                    clearInterval(interval);
                    
                    const finalIndex = Math.floor(Math.random() * foodList.length);
                    resultEl.innerText = foodList[finalIndex];
                    
                    resultEl.classList.remove('spinning');
                    spinBtn.disabled = false;
                    spinBtn.innerText = "換個口味？";
                    isSpinning = false;
                }
            }, 80);
        });
    </script>
</body>
</html>
